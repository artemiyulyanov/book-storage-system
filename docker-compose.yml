version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: book_storage_system_postgres

    environment:
      POSTGRES_DB: books_storage_db
      POSTGRES_USER: books_user
      POSTGRES_PASSWORD: books_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books_user -d books_storage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: book_storage_system_api
    environment:
      DATABASE_URL: "host=postgres port=5432 user=books_user password=books_password dbname=books_storage_db sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: